name: Nochalant Club v2 CI

on:
  pull_request:
    branches: [v2]
  push:
    branches: [v2]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm cache clean --force\n      - run: npm install --no-audit --no-fund
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
