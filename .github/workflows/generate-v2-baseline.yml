name: Generate V2 Prisma baseline

on:
  workflow_dispatch:
  push:
    branches: [v2]
    paths:
      - "prisma/schema.prisma"
      - ".github/workflows/generate-v2-baseline.yml"

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      - name: Generate complete schema SQL from empty database
        run: |
          mkdir -p prisma/migrations/20261107170000_v2_complete_schema_baseline
          pnpm exec prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > prisma/migrations/20261107170000_v2_complete_schema_baseline/migration.sql
      - name: Commit generated baseline
        run: |
          test -s prisma/migrations/20261107170000_v2_complete_schema_baseline/migration.sql
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations/20261107170000_v2_complete_schema_baseline/migration.sql
          git diff --cached --quiet || git commit -m "Generate complete V2 Prisma baseline"
          git push origin HEAD:v2
